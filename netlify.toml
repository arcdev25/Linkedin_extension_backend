# Netlify runs this backend as a single Lambda function rather than a
# long-lived server. Every request is rewritten to that function.

# No `base` key: when this folder is pushed as its own repo, the repo root IS
# the backend and there is no subdirectory to descend into. If you instead push
# the whole project, add: base = "backend"

[build]
  command   = "npm install"
  # No static output — this project is API-only. The folder just has to exist.
  publish   = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Bundle with esbuild rather than leaving module-system detection to chance.
  node_bundler = "esbuild"
  # Keep the ESM source intact instead of transpiling it to CommonJS.
  node_version = "20"

# Send everything to the Express app. Without this, Netlify looks for static
# files at /auth/login etc. and returns 404 — which is the usual reason a
# working local server appears dead once deployed.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
