# Netlify runs this backend as a single Lambda function rather than a
# long-lived server. Every request is rewritten to that function.
#
# No `base` key: this repo's root IS the backend, so there is no
# subdirectory to descend into.

[build]
  command   = "npm install"
  publish   = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Send everything to the Express app. Without this, Netlify looks for static
# files at /auth/login etc. and returns 404.
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true